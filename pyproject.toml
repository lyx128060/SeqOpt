[project]
name = "seqopt"
version = "0.1.0"
description = "LLM-guided C-source optimization for HMMER jackhmmer, with paired-measurement acceptance and a noise-floor calibration study"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2",
    "PyYAML",
]

[project.optional-dependencies]
test = ["pytest"]
# Only the optional pyhmmer profile-prepass path needs this; the default
# evaluation path shells out to a compiled HMMER CLI.
pyhmmer = ["pyhmmer"]
# Only the optional "model as proposer" path needs this; the default entrypoints
# use a file/callback proposer.
llm = ["openai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The distribution is named "seqopt" but the import package is "seq_align".
# The import path is intentionally left as-is: it is wired into the engine's
# relative imports, the harness entry points and the path bootstrap, so renaming
# it would mean editing working code for a cosmetic gain.
packages = ["workspace/seq_align"]

[tool.pytest.ini_options]
# conftest.py puts workspace/ and harness_plugins/ on sys.path, so no PYTHONPATH
# setup is needed for `pytest tests/`.
testpaths = ["tests"]
markers = [
    "requires_hmmer_source: needs an HMMER 3.4 source tree under tools/hmmer-3.4/ (run scripts/setup_hmmer.sh)",
]
